<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>我的随手记 · 迹</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Manrope:wght@400;500;600;700;800&family=Noto+Sans+SC:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body data-page="notes">
    <div class="app-shell">
      <aside class="sidebar" id="sidebar"></aside>
      <div class="content">
        <header class="topbar" id="topbar"></header>
        <main class="main notes-main">
          <div class="section-head notes-heading">
            <div>
              <div class="eyebrow">QUICK NOTES</div>
              <h1 class="page-title">我的随手记</h1>
              <p class="page-subtitle">那些还没有成为完整故事的念头，也值得被留下。</p>
            </div>
            <div class="notes-total"><strong id="notes-count">0</strong><span>条随手记</span></div>
          </div>
          <section class="notes-timeline" id="notes-list" aria-live="polite"></section>
        </main>
      </div>
    </div>
    <div id="global-modals"></div><div class="toast" id="toast"></div>
    <script type="module" src="/app.js"></script>
  </body>
</html>
