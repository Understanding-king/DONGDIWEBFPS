<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>设置 · 迹</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" /><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Manrope:wght@400;500;600;700;800&family=Noto+Sans+SC:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body data-page="settings">
    <div class="app-shell"><aside class="sidebar" id="sidebar"></aside><div class="content"><header class="topbar" id="topbar"></header><main class="main">
      <div class="section-head"><div><div class="eyebrow">WORKSPACE</div><h1 class="page-title">设置</h1><p class="page-subtitle">连接模型、管理自定义分类，让记录流程更顺手。</p></div></div>
      <div class="settings-grid"><section class="settings-panel"><h2>模型与 API Key</h2><p>当前为本地 MVP。填入自己的 Key 后，即可把预留的调用方法接到真实服务。</p><form id="settings-form"><div class="field"><label class="api-label" for="deepseek-key">DeepSeek V4 Pro · 文字分析</label><input id="deepseek-key" type="password" placeholder="sk-..." autocomplete="off" /><p class="api-help">用于标题、分类、文本总结和经历检索。</p></div><div class="field"><label class="api-label" for="glm-key">GLM API Key · 文件 / 图片 / 语音</label><input id="glm-key" type="password" placeholder="填入 GLM API Key" autocomplete="off" /><p class="api-help">图片与文件使用 GLM-5V-Turbo；录音使用 GLM-ASR-2512 专用转写接口。两者复用同一个 Key，并依次调用。</p></div><div class="api-status" id="api-status"><span></span><span class="api-status-text">尚未连接真实模型，当前使用本地演示分析</span></div><div class="save-bar"><button class="btn btn-primary" type="submit">保存设置</button></div></form></section><aside class="settings-panel"><h2>自定义分类</h2><p>创建你自己的分类，之后可以在记录页面直接选择。</p><form id="category-form"><div class="field"><label class="api-label" for="custom-category">新分类名称</label><div class="input-with-action"><input id="custom-category" type="text" placeholder="例如：公益倡议" /><button class="input-action" type="submit">添加</button></div></div></form><div class="custom-category-list" id="custom-category-list"></div></aside></div>
    </main></div></div>
    <div id="global-modals"></div><div class="toast" id="toast"></div><script type="module" src="/app.js"></script>
  </body>
</html>
